[project]
name = "langtools-praat"
version = "0.1.0"
description = "Independent speech annotation and audio inspection workflow"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "soundfile>=0.13,<0.14"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<6.9", "pyqtgraph>=0.13.7,<0.14", "sounddevice>=0.5.3,<0.6"]

[project.scripts]
langtools-praat = "langtools_praat.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-qt>=4.5,<5", "ruff>=0.14,<0.15"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langtools_praat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
